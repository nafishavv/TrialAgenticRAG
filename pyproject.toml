[project]
name = "ragtrial"
version = "0.1.0"
description = "Agentic & naive RAG for Dukcapil + OPD Kab. Batang (extensible to more sources & tools)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.1",
    "langchain>=1.2.10",
    "langchain-classic>=1.0.1",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.14",
    "langchain-google-genai>=4.2.1",
    "langgraph>=1.0.9",
    "langchain-chroma>=0.2.0",
    "pymupdf>=1.27.1",
    "pypdf>=6.7.1",
    "python-dotenv>=1.2.1",
    "rank-bm25>=0.2.2",
    "pdfplumber>=0.11.9",
    "streamlit>=1.40",
    "semantic-router>=0.1.15",
    "requests>=2.32.5",
    "beautifulsoup4>=4.15.0",
]

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "matplotlib>=3.10.0",
    "pandas>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragtrial"]
